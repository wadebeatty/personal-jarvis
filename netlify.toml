[build]
  publish = "public"
  # Functions v2 keep `import "@netlify/blobs"` and NFT copies node_modules
  # into the zip. `netlify deploy --dir --functions` skips this install.
  command = "npm ci && npm run build"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=()"
